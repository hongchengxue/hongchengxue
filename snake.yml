name: Generate Snake

# 每天自动更新贪吃蛇（含年月周标签），并把结果发布到 output 分支。
# 注意：需要在仓库 Settings → Actions → General → Workflow permissions
# 勾选 "Read and write permissions"，否则推送 output 分支会失败。

on:
  schedule:
    # 每天 UTC 00:00 更新一次
    - cron: "0 0 * * *"
  workflow_dispatch: # 支持手动触发
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/add-snake-labels.js"
      - "README.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1) 用 Platane/snk 生成贪吃蛇 SVG（亮色 + 暗色两套配色）
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#0969da
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#a371f7

      # 2) 补上「年 / 月 / 周」标签（与 GitHub 原贡献日历布局一致）
      - name: Add year / month / weekday labels
        run: node scripts/add-snake-labels.js dist

      # 3) 发布到 output 分支（不污染 main 的提交历史）
      - name: Publish SVGs to the output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output
          git rm -rf --ignore-unmatch . 2>/dev/null || true
          cp dist/*.svg .
          rm -rf dist
          git add -A
          git commit -m "chore: update snake SVGs ($(date -u +%Y-%m-%d))" || echo "nothing to commit"
          git push -f origin output
